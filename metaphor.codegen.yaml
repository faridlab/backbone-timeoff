# Codegen policy for timeoff.
#
# `user_owned` globs are hand-written files that live inside generator-owned trees but are
# NOT schema-derived. `metaphor schema generate [--force]` skips them wholesale (never reads,
# merges, or deletes them). Everything else in src/ is regenerated from schema/models.
#
# Re-exports/declarations that must sit alongside generated code live inside
# `// <<< CUSTOM ... // END CUSTOM` markers (service/mod.rs, presentation/http/mod.rs, lib.rs)
# and are preserved by the marker mechanism, not listed here.
#
# Add your hand-authored services, handlers, tests, and docs below as you write them.

user_owned:
  # Hand-authored behavior (services + their HTTP surface). Examples:
  # - "src/application/service/onboarding_service.rs"
  # - "src/presentation/http/guarded_routes.rs"

  # User-owned repositories: hold hand-written SQL (the `paid_leave_days` read-port on the request
  # repo; the draw/restore balance engine on the balance repo). Declared here so `metaphor schema
  # generate` skips them wholesale — mirrors the backbone-attendance `present_days` convention and
  # backbone-hr's user-owned leave_application_repository / leave_balance_repository.
  - "src/infrastructure/persistence/timeoff_request_repository.rs"
  - "src/infrastructure/persistence/timeoff_balance_repository.rs"

  # Hand-authored leave-drawdown write service (approve/reject/cancel with tx-gated balance draw +
  # restore). Ported verbatim from backbone-hr's hr_write_service.rs; preserved across regen via the
  # `*_custom.rs` suffix, but listed here for visibility alongside the repos it depends on.
  - "src/application/service/timeoff_request_service_custom.rs"
  # The leave-lifecycle event seam: TimeoffEventSink + LeaveSettled (approved / refused /
  # cancelled / voided) published from the write path's settling verbs — the signal the timesheet
  # leave-row regeneration and payroll settlement consume.
  - "src/application/service/timeoff_events.rs"

  # CRITICAL: exports/services.rs has the hand-written paid_leave_days trait method.
  # Without user_owned, regen OVERWRITES it and loses the port.
  - "src/exports/services.rs"
  # Hand-written TimeoffQueryService impl (delegates standard lookups + paid_leave_days).
  - "src/application/service/timeoff_query_service.rs"
  # ADR-005 consumer: zeroes leave balance on offboarding.closed.
  - "src/application/service/offboarding_encash_handler.rs"

  # Wave 1 P1 (H-2) — the accrual engine + the approvals seam: the daily walk's
  # SQL (SKIP LOCKED claim / guarded apply / expiry stamp), the engine itself
  # (period math, cap, postponed carry), and the port trait the composing app
  # implements against backbone-approvals once H-9 lands.
  - "src/infrastructure/persistence/timeoff_accrual_repository.rs"
  - "src/application/service/accrual_service.rs"
  - "src/application/service/approvals_port.rs"

  # Behavior tests (the golden cases / oracle) + BDD features.
  - "tests/features/**"
  # Wave 1 P1 (H-2): live-pool helpers + the accrual/seam behavior tests.
  - "tests/common/**"
  - "tests/accrual_test.rs"
  # Leave-settlement event probes: the capturing-sink double proving every settling
  # verb publishes LeaveSettled (approved / refused / cancelled / voided).
  - "tests/leave_settlement_probe.rs"
  # - "tests/*_golden_cases.rs"
  # - "tests/integrity_probes.rs"

  # Hand-authored migrations (the tenancy strip — the strip's ordering guard
  # is hand-authored logic, not schema-derived emission).
  - "migrations/20260911063000_strip_company_tenancy.up.sql"
  - "migrations/20260911063000_strip_company_tenancy.down.sql"

  # Hand-authored module documentation.
  - "docs/**"
