components:
  schemas:
    TimeoffAccrualPlan:
      type: object
      required:
        - id
        - timeoff_type_id
        - name
        - metadata
      properties:
        id:
          type: string
          format: uuid
        timeoff_type_id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 120
        metadata:
          type: object

    TimeoffAccrualPlanBulkResult:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TimeoffAccrualPlan'
        total: { type: integer }
        failed: { type: integer }
        errors:
          type: array
          items: { type: string }

    CreateTimeoffAccrualPlanRequest:
      type: object
      required:
        - timeoff_type_id
        - name
        - metadata
      properties:
        timeoff_type_id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 120
        metadata:
          type: object

    UpdateTimeoffAccrualPlanRequest:
      type: object
      required:
        - timeoff_type_id
        - name
        - metadata
      properties:
        timeoff_type_id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 120
        metadata:
          type: object

    PatchTimeoffAccrualPlanRequest:
      type: object
      properties:
        timeoff_type_id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 120
        metadata:
          type: object

    TimeoffAccrualPlanList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TimeoffAccrualPlan'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    TimeoffAccrualLevel:
      type: object
      required:
        - id
        - plan_id
        - sequence
        - start_count
        - start_type
        - frequency
        - added_value
        - is_added_based_on_worked_time
        - action_with_lost_days
        - metadata
      properties:
        id:
          type: string
          format: uuid
        plan_id:
          type: string
          format: uuid
        sequence:
          type: integer
          format: int32
        start_count:
          type: string
        start_type:
          type: string
        frequency:
          type: string
        added_value:
          type: string
        is_added_based_on_worked_time:
          type: boolean
        maximum_leave:
          nullable: true
          type: string
        action_with_lost_days:
          type: string
        postponed_max_days:
