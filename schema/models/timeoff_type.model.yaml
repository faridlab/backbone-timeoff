# =============================================================================
# Domain: Timeoff
# Entity: TimeoffType
# Description: A leave policy/type (annual, sick, maternity, ...). Tenant-agnostic.
# An employee's per-period TimeoffBalance is allocated against a timeoff type; an
# approved TimeoffRequest draws it down. Posts NO GL.
# =============================================================================

models:
  # Tenancy: none, by design (ADR-0029). Tenant-agnostic and reusable; a composing
  # service's tenancy decorator owns org scoping for this table, including the
  # per-unit unique on (code) that keeps one leave vocabulary per unit.
  - name: TimeoffType
    collection: timeoff_types
    description: "Leave policy/type (annual, sick, maternity, ...)"
    fields:
      id:
        type: uuid
        attributes: ["@id", "@default(uuid)"]
        description: "Unique timeoff type id"
      name:
        type: string
        attributes: ["@required", "@max(120)"]
        description: "Leave type name (Annual / Sick / Maternity / ...)"
      code:
        type: string?
        attributes: ["@max(40)"]
        description: "Stable code (annual/sick/...)"
      is_paid:
        type: boolean
        attributes: ["@default(true)"]
        description: "Paid leave? (feeds payroll payable-days)"
      allow_carry_forward:
        type: boolean
        attributes: ["@default(false)"]
        description: "Carry unused balance to next period"

      max_days_per_request:
        type: decimal?
        attributes: ["@precision(8,2)"]
        description: "The ceiling one request of this type may ask for, in days (a half day is 0.5). NULL = no per-request cap; the balance is still the hard floor. Enforced at submit."
      metadata:
        type: Metadata
        attributes: ["@audit_metadata"]
        description: "Audit metadata"
